quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ringlab}
%dev.quarkus.datasource.username=${DB_USER:ringlab}
%dev.quarkus.datasource.password=${DB_PASSWORD:ringlab}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.datasource.devservices.image-name=postgres:17
mp.jwt.verify.issuer=ringlab
smallrye.jwt.new-token.issuer=ringlab
smallrye.jwt.new-token.lifespan=3600
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
quarkus.http.limits.max-body-size=64K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=permit
