quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/ringlab}
%dev.quarkus.datasource.username=${DB_USER:ringlab}
%dev.quarkus.datasource.password=${DB_PASSWORD:ringlab}
%prod.quarkus.datasource.jdbc.url=${DB_URL}
%prod.quarkus.datasource.username=${DB_USER}
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
quarkus.datasource.devservices.image-name=postgres:17
mp.jwt.verify.issuer=ringlab
smallrye.jwt.new-token.issuer=ringlab
smallrye.jwt.new-token.lifespan=3600
%dev.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:.keys/public.pem}
%dev.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:.keys/private.pem}
%prod.mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY}
%prod.smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY}
quarkus.http.limits.max-body-size=64K
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${FRONTEND_ORIGIN:http://localhost:5173,http://127.0.0.1:5173,https://ringlabgarage.com}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=permit
quarkus.rest-client.steam-news.url=${STEAM_BASE_URL:https://api.steampowered.com}
quarkus.rest-client.steam-news.connect-timeout=2000
quarkus.rest-client.steam-news.read-timeout=3000
steam.app-id=${STEAM_APP_ID:2486820}
google.client-id=${GOOGLE_CLIENT_ID:}
ringlab.public-base-url=${PUBLIC_BASE_URL:http://localhost:5173}
ringlab.mail.from=${MAIL_FROM:noreply@ringlabgarage.com}
quarkus.mailer.host=${SMTP_HOST:localhost}
quarkus.mailer.port=${SMTP_PORT:1025}
quarkus.mailer.username=${SMTP_USERNAME:}
quarkus.mailer.password=${SMTP_PASSWORD:}
quarkus.mailer.tls=${SMTP_TLS:false}
%dev.quarkus.mailer.mock=true
%test.quarkus.mailer.mock=true
ringlab.rate-limit.general=${RATE_LIMIT_GENERAL:120/PT1M}
ringlab.rate-limit.build-list=${RATE_LIMIT_BUILD_LIST:60/PT1M}
ringlab.rate-limit.news=${RATE_LIMIT_NEWS:30/PT1M}
ringlab.rate-limit.login=${RATE_LIMIT_LOGIN:10/PT1M}
ringlab.rate-limit.google-login=${RATE_LIMIT_GOOGLE_LOGIN:10/PT1M}
ringlab.rate-limit.registration=${RATE_LIMIT_REGISTRATION:5/PT1H}
ringlab.rate-limit.resend-verification=${RATE_LIMIT_RESEND_VERIFICATION:5/PT1H}
ringlab.rate-limit.build-creation=${RATE_LIMIT_BUILD_CREATION:10/PT1M}
ringlab.rate-limit.comment-creation=${RATE_LIMIT_COMMENT_CREATION:10/PT1M}
ringlab.rate-limit.voting=${RATE_LIMIT_VOTING:60/PT1M}
ringlab.rate-limit.authenticated-mutation=${RATE_LIMIT_AUTHENTICATED_MUTATION:30/PT1M}
ringlab.rate-limit.bucket-idle-timeout=${RATE_LIMIT_BUCKET_IDLE_TIMEOUT:PT2H}
ringlab.rate-limit.max-buckets=${RATE_LIMIT_MAX_BUCKETS:10000}
ringlab.rate-limit.trust-cloudflare-client-ip=${TRUST_CLOUDFLARE_CLIENT_IP:false}
ringlab.rate-limit.trusted-proxy-address=${TRUSTED_PROXY_ADDRESS:}
