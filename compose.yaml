services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ringlab
      POSTGRES_USER: ringlab
      POSTGRES_PASSWORD: ringlab
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ringlab"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
