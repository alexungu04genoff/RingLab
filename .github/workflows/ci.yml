name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ringlab_test
          POSTGRES_USER: ringlab
          POSTGRES_PASSWORD: ringlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringlab -d ringlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/ringlab_test
      DB_USER: ringlab
      DB_PASSWORD: ringlab_test
      JWT_PUBLIC_KEY: ${{ github.workspace }}/backend/.keys/public.pem
      JWT_PRIVATE_KEY: ${{ github.workspace }}/backend/.keys/private.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: java backend/scripts/GenerateJwtKeys.java backend/.keys
      - run: mvn -f backend/pom.xml verify

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
