name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: ringlab_test
          POSTGRES_USER: ringlab
          POSTGRES_PASSWORD: ringlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ringlab -d ringlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://localhost:5432/ringlab_test
      QUARKUS_DATASOURCE_USERNAME: ringlab
      QUARKUS_DATASOURCE_PASSWORD: ringlab_test
      JWT_PUBLIC_KEY: ${{ github.workspace }}/backend/.keys/public.pem
      JWT_PRIVATE_KEY: ${{ github.workspace }}/backend/.keys/private.pem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: java backend/scripts/GenerateJwtKeys.java backend/.keys
      - name: Test backend and enforce coverage thresholds
        run: mvn -f backend/pom.xml verify
      - name: Add backend coverage to the job summary
        if: always()
        run: node scripts/coverage-summary.mjs backend backend/target/site/jacoco/jacoco.xml
      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/target/site/jacoco
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - name: Test frontend and enforce coverage thresholds
        run: npm run test:coverage
        working-directory: frontend
      - name: Add frontend coverage to the job summary
        if: always()
        run: node scripts/coverage-summary.mjs frontend frontend/coverage/coverage-summary.json
      - name: Upload frontend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage
          if-no-files-found: warn
      - run: npm run build
        working-directory: frontend

  publish-images:
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Require the existing public Google client ID
        env:
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
        run: test -n "$GOOGLE_CLIENT_ID"
      - name: Select lowercase GHCR image names
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "prefix=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}-backend:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.prefix }}-frontend:${{ github.sha }}
          build-args: |
            VITE_GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
