name: Deploy production manually
run-name: Deploy production ${{ inputs.revision }}

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full 40-character commit SHA with successful main CI and both GHCR images
        required: true
        type: string

permissions:
  contents: read
  actions: read
  packages: read

concurrency:
  group: ringlab-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ringlabgarage.com
    env:
      REVISION: ${{ inputs.revision }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require successful main CI for the selected SHA
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required.' >&2; exit 1; }
          count=$(gh api "repos/$REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$REVISION&branch=main&event=push&status=success&per_page=100" --jq '.total_count')
          (( count > 0 )) || { echo 'No successful main push CI run exists for this SHA.' >&2; exit 1; }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Require both images and resolve immutable digests
        id: images
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          prefix="ghcr.io/${REPOSITORY,,}"
          for service in backend frontend; do
            digest=$(docker buildx imagetools inspect "$prefix-$service:$REVISION" --format '{{.Manifest.Digest}}')
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Missing or invalid $service image." >&2; exit 1; }
            echo "$service=$prefix-$service@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Configure SSH with a verified host key
        env:
          SSH_KEY: ${{ secrets.PRODUCTION_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.PRODUCTION_SSH_KNOWN_HOSTS }}
          VPS_HOST: ${{ secrets.PRODUCTION_HOST }}
          VPS_USER: ${{ secrets.PRODUCTION_SSH_USER }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS"
          [[ "$VPS_HOST" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]]
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
          umask 077
          mkdir -p "$RUNNER_TEMP/ringlab-ssh"
          printf '%s\n' "$SSH_KEY" > "$RUNNER_TEMP/ringlab-ssh/key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/ringlab-ssh/known_hosts"
      - name: Pull and deploy the selected images on the VPS
        env:
          VPS_HOST: ${{ secrets.PRODUCTION_HOST }}
          VPS_USER: ${{ secrets.PRODUCTION_SSH_USER }}
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          set -euo pipefail
          # Only validated SHA/digest references enter the remote shell command.
          ssh -F /dev/null -i "$RUNNER_TEMP/ringlab-ssh/key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ringlab-ssh/known_hosts" \
            -o ConnectTimeout=15 "$VPS_USER@$VPS_HOST" \
            "sudo -n bash -s -- '$REVISION' '$BACKEND_IMAGE' '$FRONTEND_IMAGE'" \
            < scripts/deploy-production.sh
      - name: Report deployed revision
        env:
          BACKEND_IMAGE: ${{ steps.images.outputs.backend }}
          FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        run: |
          {
            echo "Deployed commit: $REVISION"
            echo "Backend: $BACKEND_IMAGE"
            echo "Frontend: $FRONTEND_IMAGE"
            echo 'Origin HTTPS homepage and API checks passed.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remove temporary SSH credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/ringlab-ssh/key" "$RUNNER_TEMP/ringlab-ssh/known_hosts"
